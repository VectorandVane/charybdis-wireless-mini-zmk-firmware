## Split keyboards
## https://zmk.dev/docs/config/system#split-keyboards
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

## ZMK Studio
## https://zmk.dev/docs/features/studio
CONFIG_ZMK_STUDIO=y
## https://zmk.dev/docs/config/studio
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=5

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_INPUT_LISTENER=y

## PMW3360 Driver
## https://github.com/KOHSUK/zmk-pmw3360-driver (branch: pmw3360)
## This implements the PMW3360's required SROM firmware upload with
## product-ID/firmware-ID verification - unlike some other community
## PMW3360 drivers that skip it, which leaves the sensor's tracking
## engine never actually running.
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3360=y
CONFIG_ZMK_POINTING=y
#CONFIG_SPI_LOG_LEVEL_DBG=y

# Cursor sensitivity is CONFIG_PMW3360_CPI / CONFIG_PMW3360_CPI_DIVIDOR, not
# CPI alone - the driver divides every raw sensor count by the dividor before
# reporting it as a relative movement (see pmw3360_report_data() in
# zmk-pmw3360-driver). CPI had been bumped 600 -> 1600 -> 4800 -> 10000
# looking for a fix for a since-resolved (hardware) tracking issue, but the
# dividor was never touched and defaults to 4, so that ran effective
# sensitivity up ~17x (150 -> 2500) and produced exactly the jerky,
# jumpier-at-higher-CPI cursor behavior this was meant to fix. Restoring the
# original working ratio here; both values are set explicitly so any future
# CPI change is a deliberate sensitivity change, not an accidental one.
CONFIG_PMW3360_CPI=600
CONFIG_PMW3360_CPI_DIVIDOR=4
# CONFIG_PMW3360_INVERT_X=y
# CONFIG_PMW3360_INVERT_Y=y
# Orientation choice - pick one if rotate-90/180/270 turns out to match
# your sensor's mounting once you can see which way the cursor moves:
# CONFIG_PMW3360_ORIENTATION_90=y
