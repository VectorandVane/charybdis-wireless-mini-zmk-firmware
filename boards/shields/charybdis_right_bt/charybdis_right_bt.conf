## Split keyboards
## https://zmk.dev/docs/config/system#split-keyboards
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

## ZMK Studio
## https://zmk.dev/docs/features/studio
CONFIG_ZMK_STUDIO=y
## https://zmk.dev/docs/config/studio
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=5

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_INPUT_LISTENER=y

## PMW3360 Driver
## https://github.com/KOHSUK/zmk-pmw3360-driver (branch: pmw3360)
## This implements the PMW3360's required SROM firmware upload with
## product-ID/firmware-ID verification - unlike some other community
## PMW3360 drivers that skip it, which leaves the sensor's tracking
## engine never actually running.
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3360=y
CONFIG_ZMK_POINTING=y
#CONFIG_SPI_LOG_LEVEL_DBG=y

CONFIG_PMW3360_CPI=600
# CONFIG_PMW3360_INVERT_X=y
# CONFIG_PMW3360_INVERT_Y=y
# Orientation choice - pick one if rotate-90/180/270 turns out to match
# your sensor's mounting once you can see which way the cursor moves:
# CONFIG_PMW3360_ORIENTATION_90=y

## Temporary debug logging - remove once the sensor is confirmed working.
## View over the right half's USB serial port (CDC ACM console) with any
## terminal (PuTTY/tio/screen) once flashed and plugged in via USB.
## What to look for in the boot log (driver: KOHSUK/zmk-pmw3360-driver):
##   "PMW3360 initialized"        -> success, sensor should report motion
##   "Invalid product id!"        -> wiring/SPI issue (wrong pins, bad solder,
##                                   SPI mode/CS/IRQ mismatch, or dead sensor)
##   "Chip is not running from SROM!" -> SROM firmware upload failed
##   "initialization failed"      -> generic; the LOG_ERR line just above it
##                                   names which init step failed. The driver
##                                   does NOT retry after a failure, so if you
##                                   don't see "PMW3360 initialized" at all,
##                                   this is why - it gave up once, silently.
CONFIG_LOG=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_PMW3360_LOG_LEVEL_DBG=y
