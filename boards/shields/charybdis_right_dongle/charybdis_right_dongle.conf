CONFIG_ZMK_USB=n # ZMK_USB is only allowed when: not split or, split and role is central (i.e., not right_dongle)

## PMW3360 Driver
## https://github.com/KOHSUK/zmk-pmw3360-driver (branch: pmw3360)
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3360=y
CONFIG_ZMK_POINTING=y
#CONFIG_SPI_LOG_LEVEL_DBG=y

# See charybdis_right_bt.conf for why both of these are set explicitly -
# sensitivity is CPI / CPI_DIVIDOR, not CPI alone.
CONFIG_PMW3360_CPI=2400
CONFIG_PMW3360_CPI_DIVIDOR=1
